<body>

        <button id="testDrawTriangle">画三角</button>
        <button id="DDADrawLine">DDA画直线</button>
        <button id="midPointDrawLine">中点画直线</button>
        <button id="bresenhamDrawLine">Bresenham画直线</button>

        <canvas id="glcanvas" width="640" height="480">

        </canvas>

</body>
<script type="module">
    import {testAngle,dda,midpointLine,bresenhamLine} from './js/myCGApi.js'
    
    document.getElementById('testDrawTriangle').onclick = function() {
        testAngle()
    }
    document.getElementById('DDADrawLine').onclick = function() {
        dda(800,100,400,300)
    }
    document.getElementById('midPointDrawLine').onclick = function() {
        midpointLine(600,50,100,350)

    document.getElementById('bresenhamDrawLine').onclick = function() {
        bresenhamLine(200,18,100,100)
    }
